<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/logo-main.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="The Brothers Barber Shop">
    <meta name="description" content="Sistema integral de gestión para The Brothers Barber Shop. Agenda citas, gestiona servicios y disfruta de una experiencia premium de barbería.">
    <meta name="keywords" content="barbería, corte de cabello, afeitado, citas online, The Brothers">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="msapplication-TileColor" content="#3b82f6">
    <meta name="msapplication-navbutton-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- PWA iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">  
    <meta name="apple-mobile-web-app-title" content="TBB Shop">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logo-main.png">
    
    <!-- Basic Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/icon-16x16.png">
    <link rel="shortcut icon" href="/images/icon-32x32.png">
    
    <!-- Microsoft Tiles (simplified) -->
    <meta name="msapplication-square150x150logo" content="/images/logo-main.png">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="The Brothers Barber Shop">
    <meta property="og:description" content="Sistema integral de gestión para barbería. Agenda tu cita online.">
    <meta property="og:image" content="/images/logo-main.png">
    <meta property="og:url" content="https://dilansg.github.io/TheBrothersBarberShop/">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Brothers Barber Shop">
    <meta name="twitter:description" content="Sistema integral de gestión para barbería. Agenda tu cita online.">
    <meta name="twitter:image" content="/images/og-image.png">
    
    <!-- LCP: precarga el logo principal del hero para que aparezca al instante -->
    <link rel="preload" as="image" href="/images/logo%201.png" fetchpriority="high">

    <!-- Fonts - Boutique Premium: Display + Sans (2 familias, ~80KB) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
    
    <title>The Brothers Barber Shop</title>

    <!-- Tema inicial (evita flash): aplica la clase antes de que cargue React -->
    <script>
      (function () {
        try {
          var forced = new URLSearchParams(window.location.search).get('theme');
          var theme = forced === 'light' || forced === 'dark'
            ? forced
            : (localStorage.getItem('tbb-theme') === 'light' ? 'light' : 'dark');
          var root = document.documentElement;
          root.classList.add(theme);
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f5f7' : '#111318');
        } catch (e) {}
      })();
    </script>
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "The Brothers Barber Shop",
      "description": "Barbería premium con servicios de corte, afeitado y cuidado personal masculino",
      "url": "https://dilansg.github.io/TheBrothersBarberShop/",
      "telephone": "+57 3105572015",
      "@type": "BarberShop",
      "priceRange": "$$",
      "openingHours": [
        "Mo-Fr 09:00-18:00",
        "Sa 09:00-16:00"
      ],
      "paymentAccepted": "Cash, Credit Card",
      "currenciesAccepted": "USD, COP"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
