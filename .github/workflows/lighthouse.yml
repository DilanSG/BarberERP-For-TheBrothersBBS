name: Lighthouse CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'lighthouse-budget.json'
      - '.github/workflows/lighthouse.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://thebrothersbarbershop.onrender.com/api/v1
          VITE_SENTRY_DSN_FRONTEND: ${{ secrets.VITE_SENTRY_DSN_FRONTEND }}

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@12
        with:
          staticDistDir: ./frontend/dist
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment results on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          LIGHTHOUSE_LINKS: ${{ steps.lighthouse.outputs.links }}
        with:
          script: |
            const links = JSON.parse(process.env.LIGHTHOUSE_LINKS || '{}');
            const reportUrl = Object.values(links)[0];
            if (!reportUrl) {
              return;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Informe de Lighthouse CI disponible en ${reportUrl}`
            });
