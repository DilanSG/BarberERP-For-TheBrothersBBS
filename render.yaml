# Render Blueprint - The Brothers Barber Shop
# Servicio web del backend (API REST) desplegado desde este repositorio.
# El frontend se despliega en Vercel.

services:
  - type: web
    name: barbershop-backend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /health
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 4h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://the-bro-barbers.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://the-bro-barbers.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: FORCE_HTTPS
        value: true
      - key: SECURE_COOKIES
        value: true
      - key: TRUST_PROXY
        value: true
